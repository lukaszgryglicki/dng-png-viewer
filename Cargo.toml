[package]
name = "dng-png-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Native fullscreen 16-bit grayscale image windowing for X11 and the text console"
license = "Apache-2.0"

[features]
static-sdl2 = ["sdl2/bundled", "sdl2/static-link"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "hdr", "exr", "qoi", "ff"] }
rayon = "1.11"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
walkdir = "2.5"

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[dev-dependencies]
jpeg-encoder = "0.7"
png = "0.18"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
