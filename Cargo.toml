[package]
name = "dng-png-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Native fullscreen 16-bit grayscale image windowing for X11 and the text console"
license = "Apache-2.0"

[features]
default = ["bundled-heif"]
bundled-heif = ["libheif-rs/embedded-libheif"]
static-sdl2 = ["sdl2/bundled", "sdl2/static-link"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
font8x8 = "0.3"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "hdr", "exr", "qoi", "ff"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjpeg-sys", "strict-mode"] }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17"] }
rawler = "0.8"
rayon = "1.11"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
walkdir = "2.5"

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
jpeg-encoder = "0.7"
openjpeg-sys = { version = "1.0.8", default-features = false }
png = "0.18"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
